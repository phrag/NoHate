name: Android CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build, Lint, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI core
        run: ./scripts/build_rust_android.sh

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Lint
        run: ./gradlew :app:lint --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release bundle (AAB)
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHate-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHate-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHate-release-aab
          path: app/build/outputs/bundle/release/*.aab


